# Default values for bank-of-anthos.
#
# Per-service overrides for replica count, image, resources, service type, and
# scheduling constraints. The frontend is exposed via a LoadBalancer Service by
# default; all other services use ClusterIP.

nameOverride: ''
fullnameOverride: ''
frontend:
  replicaCount: 1
  image:
    repository: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/frontend
    tag: v0.6.10
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  service:
    type: LoadBalancer
    port: 80
    targetPort: 8080
  nodeSelector: {}
  tolerations: []
  affinity: {}
