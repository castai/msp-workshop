# =============================================================================
# E-commerce demo — platform workloads (fixed version)
#
# Three services that together form a small e-commerce platform:
#   * web-frontend    — public-facing web tier (hpa-example)
#   * order-service   — backend order processing (hpa-example)
#   * notification-service — lightweight backend (nginx)
#
# Production-quality configuration so the demo can be load-tested:
#   * CPU request 200m / limit 1000m — sane HPA utilization math
#   * Memory request 128Mi / limit 256Mi
#   * Replicas: 2 — minimum for HA, small enough for the kind cluster
#   * nodeSelector workshop-role=worker — pods land on the 3 worker nodes
#   * topology spread across kubernetes.io/hostname — pods spread across
#     the 3 worker nodes instead of stacking on one
#   * readiness + liveness probes — traffic only hits ready pods
#   * ClusterIP Service per workload — reachable inside the cluster
# =============================================================================

---
# --- Web Frontend -----------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: demo-ecommerce
  labels:
    app: web-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
        tier: frontend
    spec:
      nodeSelector:
        workshop-role: worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web-frontend
      containers:
        - name: web-frontend
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: demo-ecommerce
spec:
  type: ClusterIP
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

