# =============================================================================
# E-commerce demo — PodDisruptionBudgets
#
# Keep at least 1 replica available during voluntary disruptions
# (drains, node maintenance, autoscaler scale-down) so the front-end and
# order pipeline never go to zero.
#
# Without these, a node drain or aggressive scale-down could take out every
# replica simultaneously and drop traffic.
# =============================================================================

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-frontend
  namespace: demo-ecommerce
  labels:
    app: web-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web-frontend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
  namespace: demo-ecommerce
  labels:
    app: order-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-service
